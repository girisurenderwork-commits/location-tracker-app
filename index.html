<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,sans-serif;background:#f0f4f8;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

header{display:flex;align-items:center;gap:16px;padding:13px 20px;background:#1a1f2e;flex-wrap:wrap;flex-shrink:0;}

.logo{display:flex;align-items:center;gap:9px;color:#fff;font-size:15px;font-weight:600;}
.logo-ring{width:14px;height:14px;border-radius:50%;border:2px solid #22d37a;display:flex;align-items:center;justify-content:center;}
.logo-ring::after{content:'';width:5px;height:5px;border-radius:50%;background:#22d37a;}

.controls{display:flex;gap:8px;align-items:center;}
input{border:1px solid #2d3450;background:#252b3d;color:#fff;padding:9px 12px;border-radius:6px;font-size:13px;font-family:'JetBrains Mono',monospace;width:190px;}
input::placeholder{color:#55607a;}
input:focus{outline:none;border-color:#22d37a;}
.btn{background:#22d37a;color:#0a1a0f;border:none;padding:9px 20px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;}
.btn:hover{background:#1ec06e;}
.btn-stop{background:transparent;color:#e05c3a;border:1px solid #e05c3a;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;display:none;}
.btn-stop:hover{background:rgba(224,92,58,0.1);}

.stats{display:flex;gap:20px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.stat{text-align:right;}
.stat-label{font-size:9px;color:#55607a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:2px;}
.stat-val{font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace;color:#fff;}
.stat-val.green{color:#22d37a;}

.badge{display:flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#55607a;}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#3d4559;transition:background 0.3s;}
.badge-dot.live{background:#22d37a;box-shadow:0 0 6px #22d37a;}
.badge-dot.err{background:#e05c3a;}
.badge-dot.wait{background:#e0a83f;}

main{flex:1;display:flex;min-height:0;}
#map{flex:1;}

#sidebar{width:280px;background:#fff;border-left:1px solid #e2e8f0;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
.sidebar-head{padding:14px 16px 10px;border-bottom:1px solid #f0f4f8;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#94a3b8;display:flex;justify-content:space-between;align-items:center;}
.count-badge{background:#f0f4f8;color:#64748b;font-size:10px;padding:2px 7px;border-radius:10px;}
#logList{flex:1;overflow-y:auto;}
#emptyState{padding:24px 16px;color:#94a3b8;font-size:12px;line-height:1.8;text-align:center;}
#emptyState strong{display:block;font-size:14px;color:#64748b;margin-bottom:6px;}

.entry{padding:11px 16px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background 0.1s;}
.entry:hover{background:#f8faff;}
.entry.latest{border-left:3px solid #22d37a;}
.entry-coords{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;color:#1e293b;}
.entry-meta{font-size:10px;color:#94a3b8;margin-top:3px;}
.entry-link{display:inline-block;margin-top:5px;font-size:10px;font-weight:500;color:#2563eb;text-decoration:none;}
.entry-link:hover{text-decoration:underline;}

/* pulsing marker */
.pmarker{position:relative;width:22px;height:22px;}
.pmarker-core{position:absolute;top:6px;left:6px;width:10px;height:10px;border-radius:50%;background:#2563eb;box-shadow:0 0 6px rgba(37,99,235,0.9);}
.pmarker-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(37,99,235,0.6);animation:ripple 1.8s ease-out infinite;}
@keyframes ripple{0%{transform:scale(0.5);opacity:1;}100%{transform:scale(2.8);opacity:0;}}

@media(max-width:680px){#sidebar{display:none;}.stats .stat:nth-child(n+3){display:none;}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-ring"></div>
    Location Tracker
  </div>

  <div class="controls">
    <input type="text" id="topicIn" placeholder="enter topic name">
    <button class="btn" id="startBtn">Connect</button>
    <button class="btn-stop" id="stopBtn">Stop</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Lat / Lon</div>
      <div class="stat-val green" id="sCoords">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Accuracy</div>
      <div class="stat-val" id="sAcc">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Speed</div>
      <div class="stat-val" id="sSpeed">—</div>
    </div>
    <div class="badge">
      <div class="badge-dot" id="bDot"></div>
      <span id="bText">not connected</span>
    </div>
  </div>
</header>

<main>
  <div id="map"></div>
  <div id="sidebar">
    <div class="sidebar-head">
      Location log
      <span class="count-badge" id="countBadge">0</span>
    </div>
    <div id="logList">
      <div id="emptyState">
        <strong>No data yet</strong>
        Enter your ntfy topic name and tap Connect.<br>
        Updates from your phone will appear here.
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){

  /* ── Map setup ── */
  var map = L.map('map').setView([22, 79], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap contributors', maxZoom:19
  }).addTo(map);

  var pulseIcon = L.divIcon({
    className:'',
    html:'<div class="pmarker"><div class="pmarker-ring"></div><div class="pmarker-core"></div></div>',
    iconSize:[22,22], iconAnchor:[11,11]
  });

  var marker = null;
  var accCircle = null;
  var trail = [];
  var trailLine = L.polyline([],{color:'#2563eb',weight:3,opacity:0.5}).addTo(map);
  var firstFix = true;
  var lastMsgId = null;

  /* ── UI refs ── */
  var topicIn  = document.getElementById('topicIn');
  var startBtn = document.getElementById('startBtn');
  var stopBtn  = document.getElementById('stopBtn');
  var bDot     = document.getElementById('bDot');
  var bText    = document.getElementById('bText');
  var sCoords  = document.getElementById('sCoords');
  var sAcc     = document.getElementById('sAcc');
  var sSpeed   = document.getElementById('sSpeed');
  var logList  = document.getElementById('logList');
  var countBadge = document.getElementById('countBadge');
  var logCount = 0;

  /* Restore saved topic */
  try{ var s = localStorage.getItem('lt_topic'); if(s) topicIn.value = s; }catch(e){}

  /* ── Status helpers ── */
  function setStatus(text, state){
    bText.textContent = text;
    bDot.className = 'badge-dot' + (state ? ' '+state : '');
  }

  /* ── Parse location message ── */
  function parseMsg(text){
    var m = text.match(/Lat:\s*(-?\d+\.?\d*),\s*Lon:\s*(-?\d+\.?\d*)/);
    if(!m) return null;
    var acc   = (text.match(/Accuracy:\s*([\d.]+)/)||[])[1];
    var time  = (text.match(/Time:\s*([\d\-: ]+)/)||[])[1];
    var speed = (text.match(/Speed:\s*([\d.]+)/)||[])[1];
    return {
      lat:   parseFloat(m[1]),
      lon:   parseFloat(m[2]),
      acc:   acc   ? Math.round(parseFloat(acc))   : null,
      time:  time  ? time.trim()                   : '',
      speed: speed ? parseFloat(speed)             : null
    };
  }

  /* ── Render location on map and sidebar ── */
  function renderLocation(p){
    /* marker */
    if(!marker){
      marker = L.marker([p.lat,p.lon],{icon:pulseIcon}).addTo(map);
    } else {
      marker.setLatLng([p.lat,p.lon]);
    }
    /* accuracy ring */
    if(p.acc !== null){
      if(!accCircle){
        accCircle = L.circle([p.lat,p.lon],{
          radius:p.acc, color:'#2563eb',
          fillColor:'#2563eb', fillOpacity:0.07, weight:1
        }).addTo(map);
      } else {
        accCircle.setLatLng([p.lat,p.lon]);
        accCircle.setRadius(p.acc);
      }
    }
    /* zoom on first fix */
    if(firstFix){ map.setView([p.lat,p.lon],16); firstFix=false; }
    else { map.panTo([p.lat,p.lon]); }
    /* trail */
    trail.push([p.lat,p.lon]);
    if(trail.length>200) trail.shift();
    trailLine.setLatLngs(trail);
    /* stats bar */
    sCoords.textContent = p.lat.toFixed(5)+', '+p.lon.toFixed(5);
    sAcc.textContent    = p.acc   !== null ? '\u00b1'+p.acc+'m'           : '\u2014';
    sSpeed.textContent  = p.speed !== null ? p.speed.toFixed(0)+' km/h'  : '\u2014';
    /* status */
    setStatus('live \u00b7 '+(p.time||'just now'), 'live');
    /* sidebar log */
    addLog(p);
  }

  function addLog(p){
    var empty = document.getElementById('emptyState');
    if(empty) empty.remove();

    /* de-highlight previous latest */
    var prev = logList.querySelector('.entry.latest');
    if(prev) prev.classList.remove('latest');

    var d = document.createElement('div');
    d.className = 'entry latest';
    var meta = [];
    if(p.time)         meta.push(p.time);
    if(p.acc  !== null) meta.push('\u00b1'+p.acc+'m');
    if(p.speed!== null) meta.push(p.speed.toFixed(0)+' km/h');
    d.innerHTML =
      '<div class="entry-coords">'+p.lat.toFixed(5)+', '+p.lon.toFixed(5)+'</div>'+
      '<div class="entry-meta">'+meta.join(' &middot; ')+'</div>'+
      '<a class="entry-link" href="https://www.google.com/maps?q='+p.lat+','+p.lon+
      '" target="_blank" rel="noopener">View on Google Maps &rarr;</a>';
    /* clicking the entry re-centers map */
    d.addEventListener('click', function(){ map.setView([p.lat,p.lon],17); });
    logList.insertBefore(d, logList.firstChild);
    logCount++;
    countBadge.textContent = logCount;
    /* trim to 40 entries */
    while(logList.children.length > 40) logList.removeChild(logList.lastChild);
  }

  /* ── Polling via ntfy JSON endpoint (works everywhere, no SSE issues) ── */
  var pollTimer = null;
  var lastSince = Math.floor(Date.now()/1000) - 1; /* start from "now" */
  var topic = '';

  function poll(useAll){
    if(!topic) return;
    /* Use since=all on first call to always get the latest cached message,
       then switch to since=<last_id> so we only get new ones */
    var since = useAll ? 'all' : lastMsgId ? lastMsgId : 'all';
    var url = 'https://ntfy.sh/'+encodeURIComponent(topic)+
              '/json?poll=1&since='+since;
    fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(function(text){
        var lines = text.trim().split('\n');
        var gotMsg = false;
        lines.forEach(function(line){
          if(!line) return;
          try{
            var obj = JSON.parse(line);
            if(obj.event === 'message' && obj.message){
              lastMsgId = obj.id; /* track last id for next poll */
              var p = parseMsg(obj.message);
              if(p){ renderLocation(p); gotMsg = true; }
            }
          }catch(e){}
        });
        if(!gotMsg && !bText.textContent.startsWith('live')){
          setStatus('connected, waiting for ping', 'live');
        }
      })
      .catch(function(err){
        setStatus('retrying... ('+err.message+')', 'err');
      });
  }

  function startPolling(t){
    topic = t;
    lastMsgId = null;
    firstFix = true;
    clearInterval(pollTimer);
    poll(true); /* first call: fetch ALL cached messages to get latest instantly */
    pollTimer = setInterval(function(){ poll(false); }, 10000);
    setStatus('connected, waiting for ping', 'wait');
    startBtn.style.display = 'none';
    stopBtn.style.display  = 'inline-block';
  }

  function stopPolling(){
    clearInterval(pollTimer);
    topic = '';
    setStatus('stopped', '');
    startBtn.style.display  = 'inline-block';
    stopBtn.style.display   = 'none';
  }

  startBtn.addEventListener('click', function(){
    var t = topicIn.value.trim();
    if(!t){ setStatus('enter a topic name first', 'err'); return; }
    try{ localStorage.setItem('lt_topic', t); }catch(e){}
    startPolling(t);
  });
  stopBtn.addEventListener('click', stopPolling);
  topicIn.addEventListener('keydown', function(e){
    if(e.key==='Enter') startBtn.click();
  });

  /* Auto-start if topic already saved */
  if(topicIn.value) startBtn.click();

})();
</script>
</body>
</html>
